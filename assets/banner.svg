<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowLine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowLine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes flowDot {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .animated-path {
        stroke-dasharray: 12, 12;
        animation: flowDot 4s linear infinite;
      }
      .pulsing-bg {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating {
        animation: floatNode 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200 M0 300H1200 M0 350H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0V400 M200 0V400 M300 0V400 M400 0V400 M500 0V400 M600 0V400 M700 0V400 M800 0V400 M900 0V400 M1000 0V400 M1100 0V400" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Glowing Ambient Circles (Background Layer) -->
  <circle cx="200" cy="100" r="180" fill="#38bdf8" opacity="0.08" class="pulsing-bg" />
  <circle cx="1000" cy="300" r="220" fill="#c084fc" opacity="0.08" class="pulsing-bg" />

  <!-- Animated Pipeline Waves (Background Graphic Layer) -->
  <g opacity="0.4" filter="url(#glow)">
    <path d="M-50 320 Q 300 240, 600 320 T 1250 280" fill="none" stroke="url(#glowLine1)" stroke-width="3" class="animated-path"/>
    <path d="M-50 350 Q 400 380, 800 300 T 1250 340" fill="none" stroke="url(#glowLine2)" stroke-width="2.5" class="animated-path" style="animation-duration: 6s;"/>
  </g>

  <!-- Decorative Pipeline Nodes (Subtle, strictly in background/flanks) -->
  <g opacity="0.6" class="floating">
    <!-- Source Node Left -->
    <rect x="70" y="280" width="80" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="110" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#93c5fd" text-anchor="middle">SOURCES</text>
    
    <!-- Connectors -->
    <path d="M150 300 L260 300" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" class="animated-path"/>

    <!-- Transform Node Left-Mid -->
    <rect x="260" y="280" width="90" height="40" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="305" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" text-anchor="middle">EXTRACT</text>

    <!-- Connectors Right -->
    <path d="M840 300 L950 300" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4" class="animated-path"/>

    <!-- Target Node Right -->
    <rect x="950" y="280" width="100" height="40" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="1000" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fbcfe8" text-anchor="middle">WAREHOUSE</text>
  </g>

  <!-- FOREGROUND TEXT (CLEAR & UNTOUCHED BY ANIMATION) -->
  <g filter="url(#shadow)">
    <!-- Top Pill Badge -->
    <rect x="475" y="45" width="250" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="600" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">⚡ SERVERLESS DATA ETL ⚡</text>

    <!-- Main Title -->
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-0.5">
      Awesome Serverless Data Integration &amp; ETL
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Curated List of SaaS Platforms, Cloud Services &amp; Open-Source ELT Engines
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(360, 225)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" opacity="0.9" stroke="#334155"/>
      <text x="65" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">🔄 Real-time ELT</text>

      <rect x="145" y="0" width="180" height="28" rx="6" fill="#1e293b" opacity="0.9" stroke="#334155"/>
      <text x="235" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">☁️ Serverless Processing</text>

      <rect x="340" y="0" width="140" height="28" rx="6" fill="#1e293b" opacity="0.9" stroke="#334155"/>
      <text x="410" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">⚡ Code-First ETL</text>
    </g>
  </g>
</svg>
